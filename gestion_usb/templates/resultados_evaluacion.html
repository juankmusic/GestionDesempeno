<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados de Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold mb-4">Resultados de Evaluación #{{ evaluacion.id }}</h2>

        <table class="table table-striped shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Indicador</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody>
                {% for resultado in resultados %}
                <tr>
                    <td>{{ resultado.indicador.nombre }}</td>
                    <td>{{ resultado.valor }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="text-end">
            <a href="{{ url_for('reportes_bp.ver_evaluaciones') }}" class="btn btn-secondary">Volver</a>
        </div>
    </div>
</body>
</html>
