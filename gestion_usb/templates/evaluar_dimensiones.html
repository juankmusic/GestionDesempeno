<!-- templates/evaluar_dimensiones.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluar por Dimensiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold mb-4">Evaluación por Dimensiones</h2>

        <form method="POST">
            {% for dimension in dimensiones %}
                <div class="mb-5">
                    <h5 class="text-primary">{{ dimension.nombre }}</h5>
                    <ul class="list-group">
                        {% for pregunta in dimension.preguntas %}
                            <li class="list-group-item">
                                <strong>{{ pregunta.texto }}</strong>

                                {% if pregunta.respuestas %}
                                    <select name="respuesta_{{ pregunta.id }}" class="form-select mt-2" required>
                                        <option value="">Selecciona una respuesta</option>
                                        {% for r in pregunta.respuestas %}
                                            <option value="{{ r.id }}">{{ r.texto }}</option>
                                        {% endfor %}
                                    </select>
                                {% else %}
                                    <div class="text-danger mt-2">
                                        ⚠ Esta pregunta aún no tiene respuestas asociadas.
                                    </div>
                                {% endif %}
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            {% endfor %}
            <div class="text-end">
                <button type="submit" class="btn btn-success">Guardar evaluación</button>
            </div>
        </form>
    </div>
</body>
</html>
