<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold mb-4">Evaluaciones Asignadas</h2>
        <a href="{{ url_for('reportes_bp.crear_evaluacion') }}" class="btn btn-primary mb-3">+ Nueva Evaluación</a>

        <table class="table table-bordered shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Evaluado</th>
                    <th>Evaluador</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for eval in evaluaciones %}
                <tr>
                    <td>{{ eval.id }}</td>
                    <td>{{ eval.usuario.nombre }}</td>
                    <td>{{ eval.evaluador.nombre }}</td>
                    <td>{{ eval.fecha }}</td>
                    <td>
                        <a href="{{ url_for('reportes_bp.responder_evaluacion', evaluacion_id=eval.id) }}" class="btn btn-sm btn-outline-primary">Responder</a>
                        <a href="{{ url_for('reportes_bp.resultados_evaluacion', evaluacion_id=eval.id) }}" class="btn btn-sm btn-outline-success">Resultados</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
