<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Responder Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold mb-4">Responder Evaluación #{{ evaluacion.id }}</h2>

        <form method="POST">
            {% for seccion in secciones %}
            <div class="mb-4">
                <h5 class="text-primary">{{ seccion.nombre }}</h5>
                <ul class="list-group">
                    {% for indicador in seccion.indicadores %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ indicador.nombre }}
                        <input type="number" step="0.1" min="0" max="5" name="valor_{{ indicador.id }}" class="form-control ms-3" style="width: 100px;" required>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}
            <div class="text-end mt-4">
                <button type="submit" class="btn btn-success">Guardar Evaluación</button>
            </div>
        </form>
    </div>
</body>
</html>
