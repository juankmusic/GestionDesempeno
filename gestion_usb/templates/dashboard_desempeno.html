<!-- templates/dashboard_desempeno.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold mb-4">Dashboard de Evaluación</h2>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card text-white bg-success shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Evaluaciones Completadas</h5>
                        <p class="display-6">{{ indicadores.completadas }}</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-warning shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Evaluaciones Pendientes</h5>
                        <p class="display-6">{{ indicadores.pendientes }}</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-info shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Promedio General</h5>
                        <p class="display-6">{{ indicadores.promedio }}%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
