<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Estilos externos -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        p { font-weight: bold; }
    </style>
</head>

<body class="login">
    <div class="overlay">
        <div class="container-login100">
            <form method="POST">
                <div class="card card0 border-0">
                    <div class="card-content">
                        <div class="iniciar-sesion"><p>Iniciar sesión</p></div>

                        {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                        {% endif %}

                        <div class="row px-3">
                            <label for="correo" class="mb-1">Email</label>
                            <input type="email" id="correo" name="correo" class="input100 mb-4"
                                placeholder="Ingrese un email válido" required>
                        </div>

                        <div class="row px-3">
                            <label for="contrasena" class="mb-1">Contraseña</label>
                            <input id="contrasena" name="contrasena" class="input100 mb-4" type="password" required>
                        </div>

                        <div class="row mb-3 px-3">
                            <button type="submit" class="btn btn-blue text-center">Conéctate</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Imágenes decorativas -->
        <img src="{{ url_for('static', filename='img/mariposa0.png') }}" class="mariposa" />
        <img src="{{ url_for('static', filename='img/group-11.png') }}" class="group-1" />
        <img src="{{ url_for('static', filename='img/Mariposa-GIF-unscreen.gif') }}" class="mariposa-gif-1" />
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>

</html>
