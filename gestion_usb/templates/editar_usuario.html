<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5" style="max-width: 720px;">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0">Editar Usuario</h5>
            </div>
            <form method="POST" class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="correo" class="form-control" value="{{ usuario.correo }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="contrasena" class="form-control" value="{{ usuario.contrasena }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rol</label>
                        <select name="id_rol" class="form-select" required>
                            {% for rol in roles %}
                                <option value="{{ rol.id }}" {% if rol.id == usuario.id_rol %}selected{% endif %}>
                                    {{ rol.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cargo</label>
                        <select name="id_cargo" class="form-select">
                            <option value="">Sin cargo</option>
                            {% for cargo in cargos %}
                                <option value="{{ cargo.id }}" {% if usuario.id_cargo == cargo.id %}selected{% endif %}>
                                    {{ cargo.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Equipo</label>
                        <select name="id_equipo" class="form-select">
                            <option value="">Sin equipo</option>
                            {% for equipo in equipos %}
                                <option value="{{ equipo.id }}" {% if usuario.id_equipo == equipo.id %}selected{% endif %}>
                                    {{ equipo.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <!-- Nuevo campo para Nivel de Contribución -->
                    <div class="col-md-6">
                        <label class="form-label">Nivel de Contribución</label>
                        <select name="nivel_contribucion" class="form-select">
                            <option value="">Selecciona un nivel de contribución</option>
                            {% for nivel in niveles_contribucion %}
                                <option value="{{ nivel.id_nivel }}" {% if usuario.nivel_contribucion_id == nivel.id_nivel %}selected{% endif %}>
                                    {{ nivel.nivel_de_contribucion }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="text-end mt-4">
                    <a href="{{ url_for('usuarios_bp.lista_usuarios') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
