<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Videos Educativos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="fw-bold mb-4">Videos Educativos</h2>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for video in videos %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ video.titulo }}</h5>
                    <p class="card-text text-muted">Tipo:{{ video.tipo_rel.nombre }} </p>
                    <iframe class="w-100 mb-3" height="250" src="{{ video.url | replace('watch?v=', 'embed/') }}" frameborder="0" allowfullscreen></iframe>

                    <!-- Progreso -->
                    <form action="{{ url_for('desarrollo_bp.registrar_progreso', video_id=video.id) }}" method="POST" class="d-flex gap-2">
                        <input type="number" name="segundos" class="form-control" placeholder="Segundos vistos" required>
                        <button type="submit" class="btn btn-outline-success">Registrar</button>
                    </form>

                    <!-- Favorito -->
                    <form action="{{ url_for('desarrollo_bp.marcar_favorito', video_id=video.id) }}" method="POST" class="mt-2">
                        <button type="submit" class="btn btn-sm {{ 'btn-danger' if video.id in favoritos else 'btn-outline-danger' }}">
                            {{ '❤️ Favorito' if video.id in favoritos else 'Marcar como favorito' }}
                        </button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <p>No hay videos disponibles.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
