<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5" style="max-width: 600px;">
        <h2 class="fw-bold mb-4">Crear Nueva Evaluación</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Evaluado:</label>
                <select name="usuario_id" class="form-select" required>
                    <option value="">Selecciona...</option>
                    {% for u in usuarios %}
                    <option value="{{ u.id }}">{{ u.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Evaluador:</label>
                <select name="evaluador_id" class="form-select" required>
                    <option value="">Selecciona...</option>
                    {% for u in usuarios %}
                    <option value="{{ u.id }}">{{ u.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="text-end">
                <a href="{{ url_for('reportes_bp.ver_evaluaciones') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Crear</button>
            </div>
        </form>
    </div>
</body>
</html>
