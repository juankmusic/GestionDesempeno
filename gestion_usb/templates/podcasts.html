<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Podcasts Educativos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="fw-bold mb-4">Podcasts Educativos</h2>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for p in podcasts %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ p.titulo }}</h5>
                    {% if p.tipo %}
                        <p class="card-text text-muted"><strong>Tipo:</strong> {{ p.tipo }}</p>
                    {% endif %}
                    <a href="{{ p.url }}" class="btn btn-outline-primary mt-3" target="_blank">Escuchar</a>
                </div>
            </div>
        </div>
        {% else %}
        <p>No hay podcasts disponibles.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
