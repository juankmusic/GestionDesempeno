<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cursos Disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="fw-bold mb-4">Cursos Disponibles</h2>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for curso in cursos %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ curso.nombre }}</h5>
                    <p class="card-text"><strong>Tipo:</strong> {{ curso.tipo }}</p>

                    {% if curso.id in progreso %}
                        <label class="form-label mt-2">Progreso: {{ progreso[curso.id] }}%</label>
                        <div class="progress mb-2">
                            <div class="progress-bar bg-success" role="progressbar"
                                 style="width: {{ progreso[curso.id] }}%" aria-valuenow="{{ progreso[curso.id] }}"
                                 aria-valuemin="0" aria-valuemax="100">
                                {{ progreso[curso.id] }}%
                            </div>
                        </div>
                    {% else %}
                        <p class="text-muted">Aún no hay progreso registrado.</p>
                    {% endif %}

                    <form method="POST" action="{{ url_for('desarrollo_bp.inscribirse_curso', curso_id=curso.id) }}">
                        <button type="submit" class="btn btn-outline-primary mt-2">Inscribirse</button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <p>No hay cursos registrados.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
